[package]
name = "dobim-s7-shell"
version = "0.0.1"
description = "DoBIM S7 스파이크 최소 Tauri 셸 (동결 코어 사이드카 동봉 시험)"
authors = ["DoBIM"]
license = "MPL-2.0"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
