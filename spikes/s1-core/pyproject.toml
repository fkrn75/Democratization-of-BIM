[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dobim-core"
version = "0.0.1"
description = "Democratization of BIM 헤드리스 코어 스파이크 S1 (버릴 코드)"
requires-python = ">=3.12,<3.13"
license = { text = "MPL-2.0" }
dependencies = [
  "ifcopenshell==0.9.0.post1",  # LGPL-3.0
  "pydantic>=2,<3",             # MIT
  "mcp==2.3.0",                 # MIT
]

[project.optional-dependencies]
# ifcopenshell.validate(express_rules=True) 가 pytest 를 요구한다 (S0 발견).
validate = ["pytest>=8"]
tokens = ["tiktoken>=0.7"]  # 응답 크기 토큰 실측(개발 전용 대용 측정). 코어 런타임 의존이 아니다
dev = ["pytest>=8", "import-linter>=2", "tiktoken>=0.7"]

[project.scripts]
dobim = "dobim_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dobim_core.family" = ["library/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tools"]
markers = ["slow: 서브프로세스·장시간 시험"]
addopts = "-q"

[tool.importlinter]
root_package = "dobim_core"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "코어는 GUI·디스플레이 라이브러리에 의존하지 않는다"
type = "forbidden"
source_modules = ["dobim_core"]
forbidden_modules = ["tkinter", "PyQt5", "PyQt6", "PySide2", "PySide6", "wx", "bpy", "matplotlib", "pyglet", "OpenGL"]

[[tool.importlinter.contracts]]
name = "순수 질의는 엔진·프로토콜 계층을 모른다"
type = "forbidden"
source_modules = ["dobim_core.queries", "dobim_core.graph"]
forbidden_modules = ["dobim_core.engine", "dobim_core.cli", "dobim_core.mcp_server", "dobim_core.dispatch", "dobim_core.ifc_model"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "MCP 서버는 CLI 를 모른다 (CLI 는 mcp serve 로 서버를 띄울 수 있다)"
type = "forbidden"
source_modules = ["dobim_core.mcp_server", "dobim_core.dispatch", "dobim_core.engine", "dobim_core.commands", "dobim_core.commands_family"]
forbidden_modules = ["dobim_core.cli"]

[[tool.importlinter.contracts]]
name = "디스패치·엔진·커맨드는 프로토콜 계층(MCP 서버)을 모른다"
type = "forbidden"
source_modules = ["dobim_core.dispatch", "dobim_core.engine", "dobim_core.commands", "dobim_core.commands_family", "dobim_core.registry"]
forbidden_modules = ["dobim_core.mcp_server", "mcp"]

[[tool.importlinter.contracts]]
name = "ifcopenshell 은 엔진과 IFC 투영 모듈만 import 한다 (커맨드는 IFC 파일을 직접 고치지 못한다, ADR-0005)"
type = "forbidden"
source_modules = ["dobim_core.commands", "dobim_core.commands_family", "dobim_core.queries", "dobim_core.graph", "dobim_core.registry",
                  "dobim_core.dispatch", "dobim_core.cli", "dobim_core.mcp_server", "dobim_core.fixture",
                  "dobim_core.paths", "dobim_core.errors"]
forbidden_modules = ["ifcopenshell"]
allow_indirect_imports = true
